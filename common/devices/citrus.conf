# Device profile: sourced by common/build.sh and common/run.sh. Copy with common/new-device.sh.
# Everything here is plain shell variables; see docs/PORTING.md for where each value comes from.

NAME="POCO (citrus)"
KIND=phone                      # phone | qemu
SOC="Qualcomm SM6115 (Kamorta)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The phone boots a Mu-Silicium UEFI (Project Silicium) with `fastboot boot`; the UEFI starts our loader.
UEFI_TARGET=citrus
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/<target>Pkg/... or prebuilt/uefi
DTB=/home/denis0001-dev/citrus-port/mac-uefi/citrus.dtb   # the phone's own device tree (from the phone's vendor_boot): the UEFI and the kernel both use it
FD_BASE=0x5FC00000              # UEFI FD ("UEFI FD" region of citrusPkg's memory map)
FD_SIZE=0x300000
PAYLOAD_BASE=0x80000000         # unlisted DDR, above the memory map top (0x62000000): kernel + images go here
BOOT_HEADER=0                   # the boot image layout the Poco M3's bootloader accepts (header v0)

# --- kernel and loader -----------------------------------------------------------------------------
# xnuloader/loader.c picks its `struct platform` by what the firmware reports (see docs/PORTING.md):
# a new SoC needs one there (common/new-device.sh writes a starting point next to this file).
FB_BASE=0x5C000000            # the "Display Reserved" region of the citrus memory map
WIFI_ATH11K=0                   # 1: build the ath11k Wi-Fi driver into the kernel (WCN6750 radios)

# --- what the run needs ----------------------------------------------------------------------------
BOOTARGS="cpus=2"               # cpus=8 hangs early on SM6115; two Kryo 260 Silver cores are enough for SB
DEFAULT_SECS=900
USERLAND_VARS=""                # extra variables for userland/build.sh, e.g. "GL=1"
# pulled from the phone's own Android into ~/fw-* (a610 zap, WCN3980 wlanmdsp+bdwlan, ADSP)
FIRMWARE="fw-gpu fw-wifi fw-audio"
