# QEMU's `virt` machine (aarch64) on any Linux computer -- no phone needed.
NAME="QEMU virt (aarch64)"
KIND=qemu
SOC="emulated Cortex-A72"

FB_BASE=                        # ramfb; xnuloader falls back to platform_qemu_virt
WIFI_ATH11K=0
BOOT_HEADER=1                   # the boot image layout: 0 = the older "sheng" one, 1 = the redwood one

SMP=4                           # QEMU's CPUs
BOOTARGS="cpus=4"               # how many of them the kernel takes
DEFAULT_SECS=1200
USERLAND_VARS=""
